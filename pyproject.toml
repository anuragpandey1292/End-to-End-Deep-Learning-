[project]
name = "end-to-end-deep-learning"
version = "0.1.0"
description = "Store Sales Forecasting End-to-End Deep Learning Architecture"
readme = "README.md"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 88
indent-width = 4
exclude = [
    ".git",
    ".venv",
    "artifacts",
    "data",
    "mlruns",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults (e.g. Depends / FastAPI)
    "B904",  # within an except clause, raise exceptions with raise ... from err
    "UP007", # Use `X | Y` for type annotations (keep typing.Union/Optional for py310 compatibility)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
